name: Update LiveConfig

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "40 21 * * *"  # UTC 21:40 = 北京时间 5:40
  push:
    branches:
      - main
    paths:
      - "lives/**"

jobs:
  live:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run LiveConfig.exe
        shell: pwsh
        working-directory: lives
        run: |
          '' | & ".\LiveConfig.exe"

      - name: Commit generated files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lives/sss.json lives/sss_qimi.json lives/sss_gulu.json lives/sss_lanlu.json
          if (git diff --cached --quiet) {
            Write-Output "没有文件更新，不执行 commit/push"
          } else {
            git commit -m "更新直播源 $(Get-Date -Format yyyyMMddHHmm)"
            git push origin main
          }
